# D004 v4 stage 2: T2 (and the T2G shadow) decide from each frozen dossier in ONE call with no tools,
# then each decision is frozen on its own before the entry open (pipeline/t2_stage2.py).
#
# Why a queue that runs all night: the subscription token carries only so much usage per 5-hour window.
# A v4 T2 may decide until 15 minutes before the entry open, so whatever one window cannot finish, the
# next run finishes. A usage-limit refusal stops that backend for this run only. Order: the D004 hash order.
name: Earnings experiment - T2 queue (D004 v4)

on:
  workflow_run:
    workflows: ["Earnings experiment - S2 window"]
    types: [completed]
  push:
    branches: ["claude/s2-trigger"]
  schedule:
    - cron: "10,40 20-23 * * 1-5"   # 16:10-19:40 EDT (15:10-18:40 EST)
    - cron: "10,40 0-14 * * 2-6"    # to 09:40 EST / 10:40 EDT next morning (the deadline is open - 15 min)
  workflow_dispatch:

concurrency:
  group: t2-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Anything waiting? (stdlib only - most runs end here in seconds)
        id: any
        env:
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime, glob, json, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/New_York"))
          n = 0
          for m in glob.glob("events/*/*/manifest.json"):
              d = os.path.dirname(m)
              try:
                  dec = json.load(open(os.path.join(d, "decision.json"), encoding="utf-8"))
                  gate = json.load(open(os.path.join(d, "gate.json"), encoding="utf-8"))
              except Exception:
                  continue
              entry = datetime.datetime.combine(datetime.date.fromisoformat(gate["timing"]["entry"]["session"]),
                                                datetime.time(9, 15), ZoneInfo("America/New_York"))
              if now >= entry:
                  continue
              need = ["manifest_t2.json"] + (["manifest_t2g.json"] if os.environ.get("HAS_GEMINI") == "true" else [])
              if dec.get("t2", {}).get("stage2") and not all(os.path.exists(os.path.join(d, x)) for x in need):
                  n += 1
          print(f"waiting={'true' if n else 'false'}")
          EOF
          cat "$GITHUB_OUTPUT"

      - if: steps.any.outputs.waiting == 'true'
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        if: steps.any.outputs.waiting == 'true'
        with:
          node-version: "22"

      - name: Claude Code CLI
        if: steps.any.outputs.waiting == 'true'
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Identify the committer
        if: steps.any.outputs.waiting == 'true'
        run: |
          git config user.name "Earnings Experiment (GitHub Actions)"
          git config user.email "actions@github.com"

      - name: Health check - PASS, or stop
        if: steps.any.outputs.waiting == 'true'
        run: python check.py

      - name: Decide and freeze what is waiting (code + one model call per event)
        if: steps.any.outputs.waiting == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          T2_ACTIONS_CLAUDE: ${{ vars.T2_ACTIONS_CLAUDE }}
        # 2026-10-08: T2 (claude) is decided primarily by the cloud routine `earnings-t2-cloud` (claude.ai cloud
        # session, a separate allowance; probed: same code, isolation passed, $0.09 a decision). Here the
        # subscription token decides only as a last resort, so the two never race. T2G (Gemini, free) still runs on
        # every pass.
        # 2026-10-20: (1) the token is refused since 2026-10-15 ("organization has disabled Claude subscription
        # access for Claude Code"), and each refusal counted as one of T2's 3 attempts, so ABT's T2 was left MISSING
        # by 16:31 ET while the cloud routine still could decide. Actions now runs claude only if the repository
        # variable T2_ACTIONS_CLAUDE is "on". (2) "last resort" was `hour >= 11`, also true right after an afternoon
        # gate. It is now 11:00-13:59 UTC only, the entry morning before the deadline. No change to model, flags,
        # prompt, dossier.py or t2_stage2.py.
        run: |
          rc=0
          python pipeline/t2_stage2.py run --backend gemini || rc=$?
          h=$((10#$(date -u +%H)))
          if [ "$T2_ACTIONS_CLAUDE" = "on" ] && [ "$h" -ge 11 ] && [ "$h" -lt 14 ]; then python pipeline/t2_stage2.py run --backend claude || rc=$?; else echo "claude backend: left to the cloud routine (T2_ACTIONS_CLAUDE='$T2_ACTIONS_CLAUDE', UTC hour $h)"; fi
          exit $rc

      # 2026-10-07: the subscription behind CLAUDE_CODE_OAUTH_TOKEN hit its WEEKLY limit on 2026-10-06 after
      # ~$5.5 of logged work (APLD's pilot T2 refused 10 times, "resets Oct 10"). Season A's peak (~165
      # prints Nov 3-5) cannot fit in it. If the ANTHROPIC_API_KEY secret exists, whatever the subscription
      # left undecided is decided now on the pay-as-you-go key: the same CLI, model, flags, prompt and code
      # (D004 v4; D005 v3 H-T2C protocol unchanged - only the account that pays differs). Inert without it.
      - name: Pay-as-you-go fallback for what the subscription could not decide
        if: always() && steps.any.outputs.waiting == 'true' && env.HAS_API_KEY == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/t2_stage2.py run --backend claude

      - name: Health check after
        if: always() && steps.any.outputs.waiting == 'true'
        run: python check.py
