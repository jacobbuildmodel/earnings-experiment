# Paper options (Alpaca paper, D011) - code only, no AI.
#
# The short iron butterfly on every live-season gate SH-X takes: opened on the snapshot session right after the
# gate is committed, closed on the reaction session from 14:30 ET. Options orders must be sent while the market
# is OPEN (limit orders queue, but entry is defined as the snapshot session), so this runs after every S2-window
# run (which fires through the window and on every claude/s2-trigger push) and on a backup cron.
# pipeline/paper_options.py sends nothing while the market is closed and never resends an order id.
name: Earnings experiment - paper options

on:
  workflow_run:
    workflows: ["Earnings experiment - S2 window"]
    types: [completed]
  schedule:
    - cron: "40,55 18,19 * * 1-5"   # 14:40-15:55 EDT / 13:40-14:55 EST backups
    - cron: "40 14 * * 1-5"         # 10:40 EDT: fill and late-exit refresh
  workflow_dispatch:
    inputs:
      command:
        description: "sync (default) or dry"
        required: false
        default: "sync"
      args:
        description: "for dry: TICKER EXPIRY STRIKE"
        required: false
        default: ""

concurrency:
  group: paper-options
  cancel-in-progress: false

jobs:
  paper-options:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Identify the committer
        run: |
          git config user.name "Earnings Experiment (GitHub Actions)"
          git config user.email "actions@github.com"

      - name: Health check - PASS, or stop
        run: python check.py

      - name: Dry build (read-only, nothing sent)
        if: github.event_name == 'workflow_dispatch' && inputs.command == 'dry'
        env:
          DRY_ARGS: ${{ inputs.args }}
        run: python pipeline/paper_options.py dry $DRY_ARGS

      - name: Send due orders, record fills, commit the ledger
        if: github.event_name != 'workflow_dispatch' || inputs.command == 'sync' || inputs.command == ''
        run: python pipeline/paper_options.py sync --commit
