# Per-event S2 gate, factor snapshot, T2 decision and freeze - run by GitHub Actions.
#
# Why here and not a claude.ai routine: that environment blocks SEC, Nasdaq, NYSE and Yahoo at its
# proxy (403, reproduced twice on 2026-09-17). GitHub-hosted runners have open egress, and the laptop
# cannot be awake at 02:30 SGT.
#
# Since 2026-09-21 the run is split: CODE gates, snapshots and freezes (pipeline/due.py); the AI step
# only writes T2 decisions and does the daily housekeeping (ops/actions_prompt.md). A failed AI step can
# no longer lose an event: code still gates it, a later run retries T2, and the day's last run freezes
# T2 as MISSING so T0 keeps the event.
#
# Schedule (UTC, Mon-Fri). The S2 window is 14:30-15:50 ET = 18:30-19:50 UTC on daylight time and
# 19:30-20:50 UTC after Nov 1.
#
# 🔴 THE RUN WAITS FOR THE WINDOW; IT DOES NOT RELY ON LANDING IN IT.
# PAYX (09-21) and DRI+BB (09-22) were lost, and the Actions API settles why: on BOTH days NO RUN AT
# ALL existed between 18:30 and 19:50 UTC - GitHub dropped both in-window fires - while the rest ran 20
# to 145 minutes late. Every run of those two days, UTC:
#   Mon 20:33 · 21:00 · 22:10 · 22:33 · 23:14 · 01:20(+1)   Tue 19:52 · 20:08 · 21:38 · 22:01 · 22:54 · 01:02(+1)
# Nothing in this pipeline failed. The design was wrong: it required a precise trigger from a scheduler
# that documents itself as best-effort, and more fires only shorten the odds.
# So the runner now does the waiting. `due.py wait` holds a run that arrives up to 4 h early until the
# window opens, so ANY fire landing in that five-hour span produces a gate - dropped fires and 2.5-hour
# delays both survive. It sleeps only when an ungated event is actually due today.
# Cheap by default: a stdlib-only pre-check ends the job in seconds on a day with nothing to do, before
# pip install or any network call.
name: Earnings experiment - S2 window

on:
  schedule:
    # Early fires: these WAIT for the window (pipeline/due.py wait) instead of needing to land in it.
    - cron: "7,37 15 * * 1-5"        # 11:07, 11:37 EDT
    - cron: "7,37 16 * * 1-5"        # 12:07, 12:37 EDT · 11:07, 11:37 EST
    - cron: "7,37 17 * * 1-5"        # 13:07, 13:37 EDT · 12:07, 12:37 EST
    - cron: "3,19 18 * * 1-5"        # 14:03, 14:19 EDT · 13:03, 13:19 EST
    # Fires already inside a window, on odd minutes:
    - cron: "33,47 18 * * 1-5"       # EDT window 18:30-19:50 UTC
    - cron: "1,15,29,33,43,47 19 * * 1-5"   # 19:01-19:29 EDT · 19:33,19:47 EST
    - cron: "1,15,29,43 20 * * 1-5"  # EST window 19:30-20:50 UTC
    - cron: "0 23 * * 1-5"           # housekeeping + last chance
  # A dispatch starts within seconds; the schedule above does not (on 2026-09-28 the first scheduled run
  # of the day began at 21:11 UTC, after the window). ops/dispatch_s2.ps1 on the laptop dispatches with
  # purpose=gate at ~10:45 ET; the run then waits for the window. A dispatch by hand defaults to
  # housekeeping, as before.
  workflow_dispatch:
    inputs:
      purpose:
        description: "housekeeping (default) or gate (gate + T2 only, no AI housekeeping)"
        required: false
        default: "housekeeping"


# ONE run at a time, for the whole workflow: the waiting gate run, its per-event T2 jobs and finalize must
# never overlap another run, or two AIs could decide the same event. A fire that arrives meanwhile queues
# (GitHub keeps one pending run and cancels older pending ones - harmless, the running one does the work).
concurrency:
  group: s2-window
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      work: ${{ steps.todo.outputs.work }}
      why: ${{ steps.todo.outputs.why }}
      housekeeping: ${{ steps.todo.outputs.housekeeping }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Anything to do at all?
        id: todo
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo("America/New_York")).date().isoformat()
          work = []
          for sf in sorted(glob.glob("universe/*/event_status.json")):
              st = json.load(open(sf, encoding="utf-8"))
              for key, ev in st["events"].items():
                  if ev.get("status") != "CONFIRMED" or ev.get("snapshot_session") != today:
                      continue
                  d = f"events/{st['season']}/{key}_{ev.get('calendar_date') or ev.get('report_date')}"
                  if not os.path.exists(f"{d}/gate.json"):
                      work.append(f"gate:{key}")
          for g in sorted(glob.glob("events/*/*/gate.json")):
              d = os.path.dirname(g)
              if not os.path.exists(f"{d}/manifest.json"):
                  gj = json.load(open(g, encoding="utf-8"))
                  entry = gj.get("timing", {}).get("entry", {}).get("session", "")
                  if gj.get("status") == "PASS" and not gj.get("dry") and today <= entry:
                      work.append(f"t2:{gj['ticker']}")
          print("work=" + ("true" if work else "false"))
          print("why=" + (", ".join(work) if work else "nothing due today"))
          PY
          echo "housekeeping=${{ github.event.schedule == '0 23 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.purpose != 'gate') }}" >> "$GITHUB_OUTPUT"
      - name: Say what was decided
        run: echo "::notice::${{ steps.todo.outputs.why }} (housekeeping=${{ steps.todo.outputs.housekeeping }})"

  s2:
    needs: precheck
    if: needs.precheck.outputs.work == 'true' || needs.precheck.outputs.housekeeping == 'true'
    runs-on: ubuntu-latest
    # Long enough to wait up to 4 h for the window, then gate; T2 runs in the `t2` jobs below.
    timeout-minutes: 330
    outputs:
      t2: ${{ steps.plan.outputs.t2 }}
      t2_json: ${{ steps.plan.outputs.t2_json }}
      last_chance: ${{ steps.plan.outputs.last_chance }}
    permissions:
      contents: write       # freeze and capture commits are pushed to main
      id-token: write
      actions: read         # lets the housekeeping step read its own run history (was HTTP 403)
    env:
      # The mid-season screen (due.py midseason -> s1_screen) pulls the Alpha Vantage calendar, and
      # without this it records "not pulled - no ALPHAVANTAGE_API_KEY" as a deviation from D003 §7.
      # That is what the 2026-09-25 run reported. grade.yml already had it; this job did not.
      ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
    steps:
      # ref: main, not the SHA that triggered the run: a run that waited in the queue behind another
      # must see that run's commits, or it would gate the same event twice.
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Identify the committer
        run: |
          git config user.name "Earnings Experiment (GitHub Actions)"
          git config user.email "actions@github.com"

      - name: Health check - PASS, or stop
        run: python check.py

      # The root fix for the lost events: if this fire arrived before the window, hold the runner
      # until the window opens rather than hoping a later fire lands inside it. No-op when nothing
      # is due, when the window is already open, or when it has closed.
      - name: Wait for the S2 window if it has not opened yet
        run: python pipeline/due.py wait

      - name: Gate and snapshot every event due now (code, no AI)
        continue-on-error: true
        run: python pipeline/due.py gate

      - name: Mid-season screen - Fridays, housekeeping run only (code, D003 §7)
        if: github.event.schedule == '0 23 * * 1-5'
        continue-on-error: true
        run: python pipeline/due.py midseason

      # Code reads the company IR feeds first and confirms the clear cases (pipeline/find_dates.py);
      # the AI housekeeping step handles what it leaves PENDING. A Season A preview had ~250 names.
      - name: Company dates found by code - housekeeping run only
        if: github.event.schedule == '0 23 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.purpose != 'gate')
        continue-on-error: true
        timeout-minutes: 90
        run: |
          for sf in universe/*/event_status.json; do
            season=$(basename "$(dirname "$sf")")
            python pipeline/find_dates.py apply "$season" --commit || echo "::warning::find_dates failed for $season"
          done

      - name: Plan the AI step
        id: plan
        run: |
          set -o pipefail
          python pipeline/due.py plan --schedule "${{ github.event.schedule || (inputs.purpose == 'gate' && 'dispatch-gate' || '') }}" | tee -a "$GITHUB_OUTPUT"
          echo "auth=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: No secret set
        if: steps.plan.outputs.claude == 'true' && steps.plan.outputs.auth != 'true'
        run: |
          echo "::error::No CLAUDE_CODE_OAUTH_TOKEN secret. T2 cannot run; code will freeze T2 as MISSING."

      - name: Remember the code the AI step must not change
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Rules 9-10 and D004 by construction: the AI's checkout has no archive/ and no outcomes/.
      - name: Hide archive/ and outcomes/ from the AI
        if: steps.plan.outputs.claude == 'true' && steps.plan.outputs.auth == 'true'
        run: |
          git sparse-checkout set --no-cone '/*' '!/archive/' '/archive/README.md' '!/outcomes/' '!/analysis/history/' '!/registry/T1_rule_v0.json' '!/registry/D006_history_study_v1.md' '!/registry/D006_implementation_v1.sha256' '!/registry/README.md'
          test ! -e outcomes && test ! -e archive/PRE_v1_closed && test ! -e analysis/history && test ! -e registry/T1_rule_v0.json && echo "fenced: archive/, outcomes/, analysis/history/ and the T1 rule are not on disk"

      - name: Housekeeping (AI) - PENDING date re-checks and the STATE.md log
        id: ai
        if: steps.plan.outputs.claude == 'true' && steps.plan.outputs.auth == 'true'
        continue-on-error: true
        timeout-minutes: 40
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Open ops/actions_prompt.md and follow the instructions below its horizontal rule exactly.
            The repository is checked out and its dependencies are installed. Code has already run
            the health check and the S2 gate for this run.

            This is the HOUSEKEEPING run: do section B only. T2 decisions are made by separate per-event
            jobs of this workflow (the `t2` job); do not write any decision.json.
            Events awaiting a T2 decision (for your log only): ${{ steps.plan.outputs.t2_events || 'none' }}

            End with the short plain-English report section C asks for.
          claude_args: |
            --model claude-opus-5
            --max-turns 150
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Restore the full checkout
        if: always()
        run: git sparse-checkout disable

      # External review (2026-09-21): the code that freezes, logs and checks must not run from a tree the
      # AI could have edited. Any change to it - committed or not - is restored and the run fails loudly.
      - name: Guard - the AI step changed no code, rule or workflow
        if: always() && steps.pre.outputs.sha != ''
        run: |
          PRE=${{ steps.pre.outputs.sha }}
          CHANGED=$(git diff --name-only "$PRE" -- pipeline check.py .github registry requirements.txt ops/actions_prompt.md CLAUDE.md CHARTER.md)
          if [ -n "$CHANGED" ]; then
            echo "::error::The AI step changed protected files: $CHANGED - restored from $PRE; review the run"
            git checkout "$PRE" -- pipeline check.py .github registry requirements.txt ops/actions_prompt.md CLAUDE.md CHARTER.md
            echo "guard_tripped=true" >> "$GITHUB_ENV"
          else
            echo "protected files unchanged since $PRE"
          fi

      - name: Log every AI tool call to the repository
        if: always() && steps.plan.outputs.claude == 'true'
        run: python pipeline/runlog.py /home/runner/work/_temp/claude-execution-output.json "${{ github.run_id }}_housekeeping"

      - name: Health check after the run
        if: always()
        run: |
          python check.py
          if [ "$guard_tripped" = "true" ]; then echo "::error::protected files were changed by the AI step"; exit 1; fi

      - name: What the AI step did
        if: always() && steps.plan.outputs.claude == 'true'
        run: |
          f=/home/runner/work/_temp/claude-execution-output.json
          if [ -f "$f" ]; then
            jq -r '[.[] | select(.type=="result")] | .[-1] | "subtype=\(.subtype) is_error=\(.is_error) turns=\(.num_turns)\nresult:\n\(.result)"' "$f" 2>/dev/null || tail -c 3000 "$f"
          else
            echo "no output file at $f"
          fi
          git log --oneline -8

      - name: Keep the full AI output
        if: always() && steps.plan.outputs.claude == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 90

  # One job per event awaiting T2, in parallel. A Season A day can bring 10+ eligible events, and D004 v2
  # wants every T2 decided by the snapshot-session close; one AI step deciding them in turn could not.
  # Each job decides and freezes ONE event, in its own fenced checkout, with its own tool-call log.
  t2:
    needs: s2
    # not skipped when s2 failed AFTER gating (a late check or guard): the gates are already on main
    if: ${{ !cancelled() && needs.s2.outputs.t2 == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        event: ${{ fromJSON(needs.s2.outputs.t2_json) }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Identify the committer
        run: |
          git config user.name "Earnings Experiment (GitHub Actions)"
          git config user.email "actions@github.com"

      # The event list was fixed at plan time; a job that starts after the deadline must not let an AI
      # read post-deadline news. Judged by the runner clock, not by the AI's own timestamp.
      - name: Is T2 still open for this event?
        id: open
        run: python pipeline/due.py t2-open ${{ matrix.event.season }} ${{ matrix.event.ticker }} ${{ matrix.event.date }} | tee -a "$GITHUB_OUTPUT"

      - name: Secret present?
        run: |
          if [ "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" != "true" ]; then
            echo "::error::No CLAUDE_CODE_OAUTH_TOKEN secret. T2 cannot run; finalize will freeze T2 as MISSING."
          fi

      - name: Remember the code the AI step must not change
        id: pre
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Rules 9-10 and D004 by construction: the AI's checkout has no archive/ and no outcomes/.
      - name: Hide archive/ and outcomes/ from the AI
        run: |
          git sparse-checkout set --no-cone '/*' '!/archive/' '/archive/README.md' '!/outcomes/' '!/analysis/history/' '!/registry/T1_rule_v0.json' '!/registry/D006_history_study_v1.md' '!/registry/D006_implementation_v1.sha256' '!/registry/README.md'
          test ! -e outcomes && test ! -e archive/PRE_v1_closed && test ! -e analysis/history && test ! -e registry/T1_rule_v0.json && echo "fenced: archive/, outcomes/, analysis/history/ and the T1 rule are not on disk"

      - name: T2 decision for ${{ matrix.event.ticker }} ${{ matrix.event.date }} (AI)
        if: steps.open.outputs.open == 'true'
        continue-on-error: true
        timeout-minutes: 45
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Open ops/actions_prompt.md and follow the instructions below its horizontal rule exactly.
            The repository is checked out and its dependencies are installed. Code has already run
            the health check and the S2 gate.

            Decide ONLY this event (section A): ${{ matrix.event.season }} ${{ matrix.event.ticker }} ${{ matrix.event.date }}
            Write decision.json and thesis.md, then STOP: do NOT run pipeline/freeze.py and do not commit -
            code freezes the event right after you, in the full checkout. Other events are decided by
            parallel jobs - do not touch them. This is not a housekeeping run.

            End with the short plain-English report section C asks for.
          claude_args: |
            --model claude-opus-5
            --max-turns 120
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebFetch"

      - name: Restore the full checkout
        if: always()
        run: git sparse-checkout disable

      # External review (2026-09-21): the code that freezes, logs and checks must not run from a tree the
      # AI could have edited. Any change to it - committed or not - is restored and the run fails loudly.
      - name: Guard - the AI step changed no code, rule or workflow
        if: always() && steps.pre.outputs.sha != ''
        run: |
          PRE=${{ steps.pre.outputs.sha }}
          CHANGED=$(git diff --name-only "$PRE" -- pipeline check.py .github registry requirements.txt ops/actions_prompt.md CLAUDE.md CHARTER.md)
          if [ -n "$CHANGED" ]; then
            echo "::error::The AI step changed protected files: $CHANGED - restored from $PRE; review the run"
            git checkout "$PRE" -- pipeline check.py .github registry requirements.txt ops/actions_prompt.md CLAUDE.md CHARTER.md
            echo "guard_tripped=true" >> "$GITHUB_ENV"
          else
            echo "protected files unchanged since $PRE"
          fi

      - name: Freeze this event (code, full checkout, runner clock)
        if: always() && steps.open.outputs.open == 'true'
        run: |
          git pull -q --no-rebase --no-edit origin main || true
          python pipeline/due.py freeze-one ${{ matrix.event.season }} ${{ matrix.event.ticker }} ${{ matrix.event.date }}

      - name: Log every AI tool call to the repository
        if: always() && steps.open.outputs.open == 'true'
        run: python pipeline/runlog.py /home/runner/work/_temp/claude-execution-output.json "${{ github.run_id }}_${{ matrix.event.ticker }}"

      - name: Nothing left unpushed
        if: always()
        run: |
          git fetch -q origin main
          if [ -n "$(git rev-list origin/main..HEAD)" ]; then
            python -c "import sys; sys.path.insert(0, 'pipeline'); from freeze import push_all; print(push_all())"
            git fetch -q origin main
            test -z "$(git rev-list origin/main..HEAD)" || { echo "::error::commits exist only on this runner"; exit 1; }
          fi

      - name: Health check after the decision
        if: always()
        run: |
          python check.py
          if [ "$guard_tripped" = "true" ]; then echo "::error::protected files were changed by the AI step"; exit 1; fi

      - name: Keep the full AI output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output-${{ matrix.event.ticker }}-${{ matrix.event.date }}
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 90

  # Code, after every T2 job: freeze a valid decision an AI left unfrozen, freeze T2 as MISSING where its
  # deadline has passed (or on the day's last run), and bring the status files in line with the record.
  finalize:
    needs: [s2, t2]
    if: always() && needs.s2.result != 'skipped' && needs.s2.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Identify the committer
        run: |
          git config user.name "Earnings Experiment (GitHub Actions)"
          git config user.email "actions@github.com"

      - name: Finalize - freeze what the AI left, sync statuses (code, no AI)
        run: |
          if [ "${{ needs.s2.outputs.last_chance }}" = "true" ]; then
            python pipeline/due.py finalize --last-chance
          else
            python pipeline/due.py finalize
          fi

      - name: Health check after the run
        if: always()
        run: python check.py
